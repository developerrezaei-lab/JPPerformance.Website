# Optional production overlay. No new public ports; existing SQL remains external.
services:
  web:
    image: jpperformance-portal-web:local
    build:
      context: .
      dockerfile: platform/Portal/Dockerfile
    mem_limit: 96m
    cpus: 0.25
    volumes:
      - ./deploy/nginx.platform.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [hosting-edge, platform]
    depends_on:
      jp-api: { condition: service_healthy }
  jp-api:
    image: jpperformance-api:local
    build:
      context: .
      dockerfile: platform/Api/Dockerfile
    restart: unless-stopped
    init: true
    mem_limit: 384m
    cpus: 0.75
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Proxy__TrustedProxyHost: web
      Database__UseSqlite: 'false'
      ConnectionStrings__Database: ${JP_DATABASE_CONNECTION:?Set the dedicated runtime SQL connection string}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      DataProtection__Path: /app/keys
    volumes: [platform-keys:/app/keys]
    networks: [platform, database]
    depends_on:
      redis: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
  jp-migrate:
    image: jpperformance-api:local
    profiles: [maintenance]
    init: true
    mem_limit: 384m
    cpus: 0.75
    command: ['--migrate']
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__UseSqlite: 'false'
      ConnectionStrings__Database: ${JP_MIGRATION_CONNECTION:?Set the dedicated migration SQL connection string}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      DataProtection__Path: /app/keys
    volumes: [platform-keys:/app/keys]
    networks: [platform, database]
    healthcheck:
      disable: true
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 96m
    cpus: 0.25
    command: ['redis-server', '--maxmemory', '48mb', '--maxmemory-policy', 'allkeys-lru']
    networks: [platform]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: '5m', max-file: '2' }
networks:
  platform:
    internal: true
  database:
    external: true
    name: ${JP_SQL_NETWORK:?Set the existing private SQL Server Docker network name}
volumes:
  platform-keys:
