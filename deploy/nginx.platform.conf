# Account HTML must be revalidated instead of retaining obsolete access links.
map $uri $jp_account_cache {
    default "";
    ~^/(login|register)(/|$) "no-store";
}
# Caddy supplies the original scheme. Only valid protocol names are forwarded to the API.
map $http_x_forwarded_proto $jp_original_scheme {
    default $scheme;
    https https;
    http http;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    charset utf-8;
    add_header Cache-Control $jp_account_cache always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
    location ~ /\. { deny all; }
    location = /login { return 302 /login/; }
    location = /register { return 302 /register/; }
    location = /portal/login { return 302 /login/; }
    location = /portal/login/ { return 302 /login/; }
    location = /portal/register { return 302 /register/; }
    location = /portal/register/ { return 302 /register/; }

    location = /portal {
        if ($arg_register = 1) { return 302 /register/; }
        return 308 /portal/;
    }
    location /portal/ {
        if ($arg_register = 1) { return 302 /register/; }
        root /opt;
        try_files $uri $uri/ /portal/index.html;
    }
    location /api/ {
        proxy_pass http://jp-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $jp_original_scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
}
